name: VIGIBARRAGENS v2.2 CI

on:
  push:
    branches:
      - main
      - feat/vigibarragens-v2-foundation
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barragens-mt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: |
          python -m compileall -q             executar.py             streamlit_app.py             scripts             st_app             vigibarragens

      - name: Run test suite
        run: python -m pytest tests -q
